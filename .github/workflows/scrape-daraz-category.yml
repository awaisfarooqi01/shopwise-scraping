# Reusable Daraz Category Scraper Workflow
#
# This is a reusable workflow that scrapes a single Daraz category with pagination support.
# It's designed to handle large categories (40k+ products) by splitting into page ranges.
#
# Called by:
#   - scrape-daraz-all.yml (orchestrator)
#   - Manual workflow_dispatch for individual categories

name: Scrape Daraz Category

on:
  workflow_call:
    inputs:
      category_name:
        description: 'Category name (must match daraz-categories.json)'
        required: true
        type: string
      start_page:
        description: 'Starting page number'
        required: false
        type: number
        default: 1
      end_page:
        description: 'Ending page number (0 = unlimited)'
        required: false
        type: string
        default: '0'
      include_reviews:
        description: 'Include review scraping'
        required: false
        type: boolean
        default: true
      max_review_pages:
        description: 'Max review pages per product (0 = unlimited)'
        required: false
        type: string
        default: '0'
    secrets:
      MONGODB_URI:
        required: true

  workflow_dispatch:
    inputs:
      category_name:
        description: 'Category name'
        required: true
        type: choice
        options:
          - 'Tablet Accessories'
          - 'Cables & Converters'
          - 'Phone Cases'
          - 'Car Mounts'
          - 'Parts & Tools'
      start_page:
        description: 'Starting page number'
        required: false
        type: number
        default: 1
      end_page:
        description: 'Ending page number (0 = unlimited)'
        required: false
        type: number
        default: 0
      include_reviews:
        description: 'Include review scraping'
        required: false
        type: boolean
        default: true
      max_review_pages:
        description: 'Max review pages per product (0 = unlimited)'
        required: false
        type: number
        default: 0

env:
  NODE_ENV: production

jobs:
  scrape-category:
    name: Scrape ${{ inputs.category_name }} (Pages ${{ inputs.start_page }}-${{ inputs.end_page || 'end' }})
    runs-on: ubuntu-latest
    timeout-minutes: 350 # ~5.8 hours (under 6-hour limit)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Create data directory
        run: mkdir -p data

      - name: Build scrape command
        id: build-cmd
        run: |
          CMD="node scripts/scrape-daraz.js --ci"
          CMD="$CMD --category \"${{ inputs.category_name }}\""
          CMD="$CMD --start-page ${{ inputs.start_page }}"

          if [ "${{ inputs.end_page }}" != "0" ]; then
            CMD="$CMD --end-page ${{ inputs.end_page }}"
          fi

          if [ "${{ inputs.include_reviews }}" == "true" ]; then
            CMD="$CMD --with-reviews"
            if [ "${{ inputs.max_review_pages }}" != "0" ]; then
              CMD="$CMD --max-review-pages ${{ inputs.max_review_pages }}"
            fi
          else
            CMD="$CMD --no-reviews"
          fi

          echo "command=$CMD" >> $GITHUB_OUTPUT
          echo "📋 Command: $CMD"

      - name: Run Daraz scraper
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          CI: 'true'
          GITHUB_ACTIONS: 'true'
        run: |
          echo "🛒 Starting Daraz scraper..."
          echo "📁 Category: ${{ inputs.category_name }}"
          echo "📄 Pages: ${{ inputs.start_page }} to ${{ inputs.end_page || 'end' }}"
          echo "💬 Reviews: ${{ inputs.include_reviews }}"
          echo ""
          ${{ steps.build-cmd.outputs.command }}

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-logs-${{ inputs.category_name }}-${{ inputs.start_page }}-${{ inputs.end_page }}
          path: |
            logs/
            data/screenshots/
          retention-days: 7

      - name: Scrape summary
        if: always()
        run: |
          echo "═══════════════════════════════════════════════════════════════"
          echo "📊 SCRAPE SUMMARY"
          echo "═══════════════════════════════════════════════════════════════"
          echo "Category: ${{ inputs.category_name }}"
          echo "Page Range: ${{ inputs.start_page }} - ${{ inputs.end_page || 'end' }}"
          echo "Reviews: ${{ inputs.include_reviews }}"
          echo "Status: ${{ job.status }}"
          echo "═══════════════════════════════════════════════════════════════"
