# ShopWise Sentiment Analysis & Fake Review Detection Workflow
#
# Processes pending reviews using Groq API (Llama-3.1-8b-instant).
# Automatically aggregates results per product and recomputes MCDM ranking scores.
#
# Required Secrets:
#   - MONGODB_URI: MongoDB connection string (production cloud)
#   - GROQ_API_KEY: Groq API authorization key

name: Sentiment Analysis & Fake Review Detection

on:
  schedule:
    - cron: '0 */2 * * *' # Run every 2 hours (12 times a day)
  workflow_dispatch:
    inputs:
      max_reviews:
        description: 'Max reviews to process per shard (0 for all, default 600 to fit 2-hour schedule)'
        required: false
        default: '600'
        type: string
      reanalyze:
        description: 'Reanalyze already analyzed reviews'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Dry run mode (preview samples only, no database changes)'
        required: false
        default: false
        type: boolean

concurrency:
  group: sentiment-analysis
  cancel-in-progress: false

jobs:
  analyze:
    name: 'Analysis Shard ${{ matrix.partition }}/8'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        partition: [0, 1, 2, 3, 4, 5, 6, 7] # 8 parallel shards running concurrently
    timeout-minutes: 120 # 2 hours max timeout (600 reviews in batches of 5 takes ~40-80 minutes)

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 📁 Create Log Directory
        run: mkdir -p logs

      - name: 🤖 Run Sentiment Analysis (Shard ${{ matrix.partition }})
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: 'llama-3.1-8b-instant'
          SENTIMENT_BATCH_SIZE: 50
          SENTIMENT_DELAY_MS: 2200
          SENTIMENT_MAX_RETRIES: 3
          NODE_ENV: production
        run: |
          CMD="node scripts/run-sentiment-analysis.js"
          
          # Pass sharding parameters
          CMD="$CMD --partition ${{ matrix.partition }} --total-partitions 8"
          
          # Handle reanalyze flag
          if [ "${{ github.event.inputs.reanalyze }}" == "true" ]; then
            CMD="$CMD --reanalyze"
          fi
          
          # Handle dry run flag
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            CMD="$CMD --dry-run"
          fi
          
          # Handle max reviews limit (per shard)
          if [ -n "${{ github.event.inputs.max_reviews }}" ] && [ "${{ github.event.inputs.max_reviews }}" != "0" ]; then
            CMD="$CMD --max ${{ github.event.inputs.max_reviews }}"
          else
            # Default limit per shard on scheduled runs
            if [ "${{ github.event_name }}" == "schedule" ]; then
              CMD="$CMD --max 600"
            fi
          fi
          
          echo "Executing Sharded Run: $CMD"
          eval $CMD

      - name: 📝 Upload Shard Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentiment-logs-shard-${{ matrix.partition }}-${{ github.run_number }}
          path: logs/*.log
          retention-days: 7
          if-no-files-found: ignore

  recalculate:
    name: 'Recalculate MCDM Product Ranks'
    needs: analyze
    runs-on: ubuntu-latest
    if: success() && github.event.inputs.dry_run != 'true'
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 📊 Recalculate MCDM Ranking Scores
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          SCORE_BATCH_SIZE: 300
          SCORE_CONCURRENCY: 25
          SCORE_RECOMPUTE_ALL: 'false'
          NODE_ENV: production
        run: |
          echo "Recomputing MCDM product scores using new positive sentiment percentages..."
          node scripts/computeProductScores.js
