# Daraz Full Scraping Orchestrator
#
# This workflow orchestrates scraping of all Daraz categories.
# Large categories (40k+ products) are split into multiple jobs with page ranges.
#
# Strategy:
#   - Each page has ~40 products
#   - With reviews: ~1 min per product = ~40 products/hour = ~1 page/min
#   - 5-hour safe limit = ~300 pages per job
#   - Split categories with 1000+ pages into multiple jobs
#
# Categories (estimated sizes):
#   - Tablet Accessories: ~10k products (~250 pages) - 1 job
#   - Cables & Converters: ~40k products (~1000 pages) - 4 jobs
#   - Phone Cases: ~50k products (~1250 pages) - 5 jobs
#   - Car Mounts: ~8k products (~200 pages) - 1 job
#   - Parts & Tools: ~15k products (~375 pages) - 2 jobs

name: Scrape Daraz All Categories

on:
  workflow_dispatch:
    inputs:
      categories:
        description: 'Categories to scrape (comma-separated or "all")'
        required: false
        type: string
        default: 'all'
      include_reviews:
        description: 'Include review scraping'
        required: false
        type: boolean
        default: true
      dry_run:
        description: 'Dry run (show plan only)'
        required: false
        type: boolean
        default: false
      pages_per_job:
        description: 'Max pages per job (affects job splitting)'
        required: false
        type: number
        default: 250

  # Schedule for weekly full scrape (Sunday 2 AM UTC)
  schedule:
    - cron: '0 2 * * 0'

env:
  NODE_ENV: production

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # SMALL CATEGORIES (< 300 pages) - Single job each
  # ═══════════════════════════════════════════════════════════════════════════

  tablet-accessories:
    name: 📱 Tablet Accessories
    if: ${{ !inputs.dry_run && (inputs.categories == 'all' || contains(inputs.categories, 'Tablet Accessories')) }}
    uses: ./.github/workflows/scraping-platforms/daraz/scrape-daraz-category.yml
    with:
      category_name: 'Tablet Accessories'
      start_page: 1
      end_page: 0 # All pages
      include_reviews: ${{ inputs.include_reviews || true }}
      max_review_pages: 3
    secrets:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}

  car-mounts:
    name: 🚗 Car Mounts
    if: ${{ !inputs.dry_run && (inputs.categories == 'all' || contains(inputs.categories, 'Car Mounts')) }}
    uses: ./.github/workflows/scraping-platforms/daraz/scrape-daraz-category.yml
    with:
      category_name: 'Car Mounts'
      start_page: 1
      end_page: 0 # All pages
      include_reviews: ${{ inputs.include_reviews || true }}
      max_review_pages: 3
    secrets:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}

  # ═══════════════════════════════════════════════════════════════════════════
  # MEDIUM CATEGORIES (300-500 pages) - 2 jobs each
  # ═══════════════════════════════════════════════════════════════════════════

  parts-tools-1:
    name: 🔧 Parts & Tools (1-250)
    if: ${{ !inputs.dry_run && (inputs.categories == 'all' || contains(inputs.categories, 'Parts & Tools')) }}
    uses: ./.github/workflows/scraping-platforms/daraz/scrape-daraz-category.yml
    with:
      category_name: 'Parts & Tools'
      start_page: 1
      end_page: 250
      include_reviews: ${{ inputs.include_reviews || true }}
      max_review_pages: 3
    secrets:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}

  parts-tools-2:
    name: 🔧 Parts & Tools (251-500)
    if: ${{ !inputs.dry_run && (inputs.categories == 'all' || contains(inputs.categories, 'Parts & Tools')) }}
    needs: parts-tools-1 # Sequential to avoid overwhelming the site
    uses: ./.github/workflows/scraping-platforms/daraz/scrape-daraz-category.yml
    with:
      category_name: 'Parts & Tools'
      start_page: 251
      end_page: 0 # Till end
      include_reviews: ${{ inputs.include_reviews || true }}
      max_review_pages: 3
    secrets:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}

  # ═══════════════════════════════════════════════════════════════════════════
  # LARGE CATEGORIES (1000+ pages) - Multiple jobs each
  # ═══════════════════════════════════════════════════════════════════════════

  # Cables & Converters (~1000 pages = 4 jobs)
  cables-converters-1:
    name: 🔌 Cables & Converters (1-250)
    if: ${{ !inputs.dry_run && (inputs.categories == 'all' || contains(inputs.categories, 'Cables')) }}
    uses: ./.github/workflows/scraping-platforms/daraz/scrape-daraz-category.yml
    with:
      category_name: 'Cables & Converters'
      start_page: 1
      end_page: 250
      include_reviews: ${{ inputs.include_reviews || true }}
      max_review_pages: 3
    secrets:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}

  cables-converters-2:
    name: 🔌 Cables & Converters (251-500)
    if: ${{ !inputs.dry_run && (inputs.categories == 'all' || contains(inputs.categories, 'Cables')) }}
    needs: cables-converters-1
    uses: ./.github/workflows/scraping-platforms/daraz/scrape-daraz-category.yml
    with:
      category_name: 'Cables & Converters'
      start_page: 251
      end_page: 500
      include_reviews: ${{ inputs.include_reviews || true }}
      max_review_pages: 3
    secrets:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}

  cables-converters-3:
    name: 🔌 Cables & Converters (501-750)
    if: ${{ !inputs.dry_run && (inputs.categories == 'all' || contains(inputs.categories, 'Cables')) }}
    needs: cables-converters-2
    uses: ./.github/workflows/scraping-platforms/daraz/scrape-daraz-category.yml
    with:
      category_name: 'Cables & Converters'
      start_page: 501
      end_page: 750
      include_reviews: ${{ inputs.include_reviews || true }}
      max_review_pages: 3
    secrets:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}

  cables-converters-4:
    name: 🔌 Cables & Converters (751-1000)
    if: ${{ !inputs.dry_run && (inputs.categories == 'all' || contains(inputs.categories, 'Cables')) }}
    needs: cables-converters-3
    uses: ./.github/workflows/scraping-platforms/daraz/scrape-daraz-category.yml
    with:
      category_name: 'Cables & Converters'
      start_page: 751
      end_page: 0 # Till end
      include_reviews: ${{ inputs.include_reviews || true }}
      max_review_pages: 3
    secrets:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}

  # Phone Cases (~1250 pages = 5 jobs)
  phone-cases-1:
    name: 📱 Phone Cases (1-250)
    if: ${{ !inputs.dry_run && (inputs.categories == 'all' || contains(inputs.categories, 'Phone Cases')) }}
    uses: ./.github/workflows/scraping-platforms/daraz/scrape-daraz-category.yml
    with:
      category_name: 'Phone Cases'
      start_page: 1
      end_page: 250
      include_reviews: ${{ inputs.include_reviews || true }}
      max_review_pages: 3
    secrets:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}

  phone-cases-2:
    name: 📱 Phone Cases (251-500)
    if: ${{ !inputs.dry_run && (inputs.categories == 'all' || contains(inputs.categories, 'Phone Cases')) }}
    needs: phone-cases-1
    uses: ./.github/workflows/scraping-platforms/daraz/scrape-daraz-category.yml
    with:
      category_name: 'Phone Cases'
      start_page: 251
      end_page: 500
      include_reviews: ${{ inputs.include_reviews || true }}
      max_review_pages: 3
    secrets:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}

  phone-cases-3:
    name: 📱 Phone Cases (501-750)
    if: ${{ !inputs.dry_run && (inputs.categories == 'all' || contains(inputs.categories, 'Phone Cases')) }}
    needs: phone-cases-2
    uses: ./.github/workflows/scraping-platforms/daraz/scrape-daraz-category.yml
    with:
      category_name: 'Phone Cases'
      start_page: 501
      end_page: 750
      include_reviews: ${{ inputs.include_reviews || true }}
      max_review_pages: 3
    secrets:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}

  phone-cases-4:
    name: 📱 Phone Cases (751-1000)
    if: ${{ !inputs.dry_run && (inputs.categories == 'all' || contains(inputs.categories, 'Phone Cases')) }}
    needs: phone-cases-3
    uses: ./.github/workflows/scraping-platforms/daraz/scrape-daraz-category.yml
    with:
      category_name: 'Phone Cases'
      start_page: 751
      end_page: 1000
      include_reviews: ${{ inputs.include_reviews || true }}
      max_review_pages: 3
    secrets:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}

  phone-cases-5:
    name: 📱 Phone Cases (1001-1250)
    if: ${{ !inputs.dry_run && (inputs.categories == 'all' || contains(inputs.categories, 'Phone Cases')) }}
    needs: phone-cases-4
    uses: ./.github/workflows/scraping-platforms/daraz/scrape-daraz-category.yml
    with:
      category_name: 'Phone Cases'
      start_page: 1001
      end_page: 0 # Till end
      include_reviews: ${{ inputs.include_reviews || true }}
      max_review_pages: 3
    secrets:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}

  # ═══════════════════════════════════════════════════════════════════════════
  # SUMMARY JOB
  # ═══════════════════════════════════════════════════════════════════════════

  summary:
    name: 📊 Scraping Summary
    runs-on: ubuntu-latest
    if: always()
    needs:
      - tablet-accessories
      - car-mounts
      - parts-tools-1
      - parts-tools-2
      - cables-converters-1
      - cables-converters-2
      - cables-converters-3
      - cables-converters-4
      - phone-cases-1
      - phone-cases-2
      - phone-cases-3
      - phone-cases-4
      - phone-cases-5

    steps:
      - name: Generate Summary
        run: |
          echo "═══════════════════════════════════════════════════════════════"
          echo "📊 DARAZ SCRAPING SUMMARY"
          echo "═══════════════════════════════════════════════════════════════"
          echo ""
          echo "📁 Categories Scraped:"
          echo "   • Tablet Accessories: ${{ needs.tablet-accessories.result || 'skipped' }}"
          echo "   • Car Mounts: ${{ needs.car-mounts.result || 'skipped' }}"
          echo "   • Parts & Tools: ${{ needs.parts-tools-2.result || 'skipped' }}"
          echo "   • Cables & Converters: ${{ needs.cables-converters-4.result || 'skipped' }}"
          echo "   • Phone Cases: ${{ needs.phone-cases-5.result || 'skipped' }}"
          echo ""
          echo "═══════════════════════════════════════════════════════════════"

      - name: Check for failures
        if: contains(needs.*.result, 'failure')
        run: |
          echo "❌ Some scraping jobs failed. Check individual job logs for details."
          exit 1
